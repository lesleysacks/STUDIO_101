<section>
    <div class="container">
        <div class="section-header">
            {% if data.eyebrow %}<span class="badge">{{ data.eyebrow }}</span>{% endif %}
            <h2>{{ data.heading }}</h2>
            {% if data.intro %}<p>{{ data.intro }}</p>{% endif %}
        </div>
        <div class="grid-3">
            {% for item in data.items %}
                <div class="card">
                    {% if item.icon_class %}<div class="card-icon"><i class="{{ item.icon_class }}" aria-hidden="true"></i></div>{% endif %}
                    <h3>{{ item.title }}</h3>
                    <p>{{ item.text }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
