{% extends "base.html" %}
{% load static %}

{% block meta_title %}404 - Page Not Found | {{ site_settings.site_name }}{% endblock %}

{% block content %}
<header class="page-header" style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <span class="badge">404 Error</span>
        <h1 style="font-size: 64px;">Scene Not Found</h1>
        <p style="margin-bottom: 32px;">The page or resource you are looking for has been moved or does not exist.</p>
        <a href="{% url 'core:home' %}" class="btn-primary">Return to Homepage</a>
    </div>
</header>
{% endblock %}
