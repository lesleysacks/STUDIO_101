databases:
  - name: studio101-db
    plan: free
    region: oregon
    databaseName: studio101
    user: studio101

services:
  - type: web
    name: lesleysacks-studio101
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studio101-db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: DJANGO_DEBUG
        value: "False"
